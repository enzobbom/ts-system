name: System E2E

on:
  pull_request:
    branches:
      - master
    paths:
      - 'docker-compose.yml'
      - 'docker-compose.e2e.yml'
      - '.env.e2e'
      - 'rabbitmq/**'
      - 'e2e/**'
      - 'e2e.sh'

permissions:
  contents: read
  packages: read

jobs:
  e2e:
    name: System E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run system E2E tests
        run: ./e2e.sh