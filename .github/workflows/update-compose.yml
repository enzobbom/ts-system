name: Update Compose Image Tag

on:
  repository_dispatch:
    types: [update-image]

permissions:
  contents: write
  packages: read

concurrency:
  group: task-scheduler-image-update
  cancel-in-progress: false

jobs:
  update-compose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.TS_SYSTEM_PAT }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read payload
        id: payload
        run: |
          echo "service=${{ github.event.client_payload.service }}" >> "$GITHUB_OUTPUT"
          echo "tag=${{ github.event.client_payload.tag }}" >> "$GITHUB_OUTPUT"

      - name: Update candidate image tag
        env:
          SERVICE: ${{ steps.payload.outputs.service }}
          TAG: ${{ steps.payload.outputs.tag }}
        run: |
          IMAGE="ghcr.io/enzobbom/ts-${SERVICE}:${TAG}"

          sed -i -E \
            "s|ghcr\\.io/enzobbom/ts-${SERVICE}:sha-[a-z0-9]+|${IMAGE}|g" \
            docker-compose.yml

      - name: Show candidate diff
        run: git diff

      - name: Run system E2E tests
        run: ./e2e.sh

      - name: Commit accepted image
        env:
          SERVICE: ${{ steps.payload.outputs.service }}
          TAG: ${{ steps.payload.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docker-compose.yml

          git diff --cached --quiet && exit 0

          git commit -m "chore(${SERVICE}): deploy ${TAG}"
          git push