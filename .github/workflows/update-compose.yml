name: Update Compose Image Tag

on:
  repository_dispatch:
    types: [update-image]

permissions:
  contents: write

jobs:
  update-compose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read payload
        id: payload
        run: |
          echo "service=${{ github.event.client_payload.service }}" >> $GITHUB_OUTPUT
          echo "tag=${{ github.event.client_payload.tag }}" >> $GITHUB_OUTPUT

      - name: Update image tag
        env:
          SERVICE: ${{ steps.payload.outputs.service }}
          TAG: ${{ steps.payload.outputs.tag }}
        run: |
          IMAGE="ghcr.io/enzobbom/ts-${SERVICE}:${TAG}"

          sed -i -E \
            "s|ghcr\\.io/enzobbom/ts-${SERVICE}:sha-[a-z0-9]+|${IMAGE}|g" \
            docker-compose.yml

      - name: Show diff
        run: git diff

      - name: Commit changes
        env:
          SERVICE: ${{ steps.payload.outputs.service }}
          TAG: ${{ steps.payload.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docker-compose.yml

          git diff --cached --quiet && exit 0

          git commit -m "chore(${SERVICE}): deploy ${TAG}"
          git push