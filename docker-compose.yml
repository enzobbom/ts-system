name: ts-system
services:

  gateway:
    image: enzobbom/ts-gateway:latest
    expose:
      - "8083"
    environment:
      TS_USER_SERVICE_URI: http://user:8080
      TS_TASK_SERVICE_URI: http://task:8081
      TS_JWT_SECRET: ${TS_JWT_SECRET}
    depends_on:
      user:
        condition: service_healthy
      task:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8083/actuator/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  user:
    image: enzobbom/ts-user:latest
    environment:
      TS_POSTGRES_HOST: postgres
      TS_POSTGRES_USER: ${TS_POSTGRES_USER}
      TS_POSTGRES_PASSWORD: ${TS_POSTGRES_PASSWORD}
      TS_SHOW_SQL: false
      TS_JWT_SECRET: ${TS_JWT_SECRET}
      TS_JWT_EXPIRATION: ${TS_JWT_EXPIRATION}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  task:
    image: enzobbom/ts-task:latest
    environment:
      TS_TASK_NOTIFICATION_TRIGGER_FREQUENCY: ${TS_TASK_NOTIFICATION_TRIGGER_FREQUENCY}
      TS_MONGO_HOST: mongo
      TS_MONGO_USER: ${TS_MONGO_USER}
      TS_MONGO_PASSWORD: ${TS_MONGO_PASSWORD}
      TS_RABBITMQ_HOST: rabbitmq
      TS_RABBITMQ_VHOST: ${TS_RABBITMQ_VHOST}
      TS_RABBITMQ_TASK_USER: ${TS_RABBITMQ_TASK_USER}
      TS_RABBITMQ_TASK_PASSWORD: ${TS_RABBITMQ_TASK_PASSWORD}
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  notifier:
    image: enzobbom/ts-notifier:latest
    environment:
      TS_SMTP_EMAIL: ${TS_SMTP_EMAIL:-}
      TS_SMTP_PASSWORD: ${TS_SMTP_PASSWORD:-}
      TS_RABBITMQ_HOST: rabbitmq
      TS_RABBITMQ_PORT: 5672
      TS_RABBITMQ_VHOST: ${TS_RABBITMQ_VHOST}
      TS_RABBITMQ_NOTIFIER_USER: ${TS_RABBITMQ_NOTIFIER_USER}
      TS_RABBITMQ_NOTIFIER_PASSWORD: ${TS_RABBITMQ_NOTIFIER_PASSWORD}
    depends_on:
        rabbitmq:
          condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8082/actuator/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  postgres:
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TS_POSTGRES_USER}
      POSTGRES_PASSWORD: ${TS_POSTGRES_PASSWORD}
      POSTGRES_DB: ts_user
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${TS_POSTGRES_USER}", "-d", "ts_user"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  mongo:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${TS_MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${TS_MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ts_task
    healthcheck:
        test: [ "CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok" ]
        interval: 30s
        timeout: 5s
        retries: 3
        start_period: 15s

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  default:
    driver: bridge
