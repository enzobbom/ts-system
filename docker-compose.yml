name: ts-system
services:

  gateway:
    image: ghcr.io/enzobbom/ts-gateway:sha-a5e27eb
    networks:
      - ts-internal
    expose:
      - "8083"
    environment:
      TS_USER_SERVICE_URI: http://user:8080
      TS_TASK_SERVICE_URI: http://task:8081
      TS_JWT_SECRET: ${TS_JWT_SECRET}
    depends_on:
      user:
        condition: service_healthy
      task:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8083/actuator/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 256m

  user:
    image: ghcr.io/enzobbom/ts-user:sha-8e51877
    networks:
      - ts-internal
    environment:
      TS_POSTGRES_HOST: postgres
      TS_POSTGRES_PORT: 5432
      TS_POSTGRES_DB: ts_user
      TS_POSTGRES_USER: ts_user
      TS_POSTGRES_PASSWORD: ${TS_POSTGRES_PASSWORD}
      TS_SHOW_SQL: false
      TS_JWT_SECRET: ${TS_JWT_SECRET}
      TS_JWT_EXPIRATION: 900000
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 256m

  task:
    image: ghcr.io/enzobbom/ts-task:sha-3d079d2
    networks:
      - ts-internal
    environment:
      TS_TASK_NOTIFICATION_TRIGGER_FREQUENCY: "0 */5 * * * *"
      TS_MONGO_HOST: mongo
      TS_MONGO_PORT: 27017
      TS_MONGO_DB: ts_task
      TS_MONGO_USER: ts_task
      TS_MONGO_PASSWORD: ${TS_MONGO_PASSWORD}
      TS_RABBITMQ_HOST: rabbitmq
      TS_RABBITMQ_PORT: 5672
      TS_RABBITMQ_VHOST: ts-system
      TS_RABBITMQ_TASK_USER: ts-task
      TS_RABBITMQ_TASK_PASSWORD: ${TS_RABBITMQ_TASK_PASSWORD}
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 256m

  notifier:
    image: ghcr.io/enzobbom/ts-notifier:sha-93c2852
    networks:
      - ts-internal
    environment:
      TS_SMTP_EMAIL: ${TS_SMTP_EMAIL}
      TS_SMTP_PASSWORD: ${TS_SMTP_PASSWORD}
      TS_RABBITMQ_HOST: rabbitmq
      TS_RABBITMQ_PORT: 5672
      TS_RABBITMQ_VHOST: ts-system
      TS_RABBITMQ_NOTIFIER_USER: ts-notifier
      TS_RABBITMQ_NOTIFIER_PASSWORD: ${TS_RABBITMQ_NOTIFIER_PASSWORD}
    depends_on:
        rabbitmq:
          condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8082/actuator/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 192m

  postgres:
    image: postgres:14-alpine
    networks:
      - ts-internal
    environment:
      POSTGRES_USER: ts_user
      POSTGRES_PASSWORD: ${TS_POSTGRES_PASSWORD}
      POSTGRES_DB: ts_user
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ts_user", "-d", "ts_user"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 512m

  mongo:
    image: mongo:8
    networks:
      - ts-internal
    environment:
      MONGO_INITDB_ROOT_USERNAME: ts_task
      MONGO_INITDB_ROOT_PASSWORD: ${TS_MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ts_task
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 512m

  rabbitmq:
    image: rabbitmq:4-management
    networks:
      - ts-internal
    restart: unless-stopped
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 256m

volumes:
  postgres_data:
  mongo_data:
  rabbitmq_data:

networks:
  ts-internal:
    driver: bridge
